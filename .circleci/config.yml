version: 2.1

# Legacy eye-tracking source. Does not substitute for real hardware/native tests.
jobs:
  legacy-source-inventory:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate source inventory and roadmap syntax
          command: |
            test -s README.md
            test -s registry/roadmap.json
            python3 -c 'import json; json.load(open("registry/roadmap.json"))'
workflows:
  inventory-only:
    jobs:
      - legacy-source-inventory
